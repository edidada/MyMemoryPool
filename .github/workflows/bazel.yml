name: Bazel

on:
  push:
    branches: [bazel]
  pull_request:
    branches: [bazel]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Bazelisk
        run: |
          curl -fsSL -o /usr/local/bin/bazel https://github.com/bazelbuild/bazelisk/releases/download/v1.30.0/bazelisk-linux-amd64
          chmod +x /usr/local/bin/bazel
          bazel version

      - name: Build
        run: bazel build //...

      - name: Test
        run: bazel test //... --test_output=errors
