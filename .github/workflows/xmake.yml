name: xmake

on:
  push:
    branches: [xmake]
  pull_request:
    branches: [xmake]

jobs:
  build-and-test:
    name: Build & test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v7

      - name: Install xmake
        run: |
          curl -fsSL https://raw.githubusercontent.com/xmake-io/xmake/master/scripts/get.sh -o /tmp/xmake-get.sh
          sudo bash /tmp/xmake-get.sh --prefix /usr/local
          xmake --version

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
        run: xmake f -m release

      - name: Build
        run: xmake build

      - name: Test
        run: xmake run test_mempool
