name: Conan

on:
  push:
    branches: [conan]
  pull_request:
    branches: [conan]

jobs:
  build-package-and-test:
    name: conan create (${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v7

      - name: Install Conan 2
        run: pip install "conan>=2.0"

      - name: Detect Conan profile
        run: conan profile detect --force

      - name: conan create (build, package, run test_package)
        # `conan create` builds the package, installs it into the local cache,
        # then builds & runs test_package/ which does find_package(mempool).
        run: conan create . --build=missing -s build_type=${{ matrix.build_type }}

      - name: Sanity: consume the cached package via find_package
        run: |
          mkdir -p /tmp/consumer && cd /tmp/consumer
          conan install --requires=mempool/0.1.0 -s build_type=${{ matrix.build_type }} --output-folder=out
